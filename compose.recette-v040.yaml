name: posture-cockpit-v040-recette
services:
  recette-v040:
    build:
      context: .
    image: posture-cockpit:v040-recette
    container_name: posture-cockpit-v040-recette
    restart: "no"
    ports:
      - "8088:8080"
    volumes:
      - recette-v040-data:/data
    environment:
      TZ: Europe/Paris
      POSTURE_COCKPIT_SESSION_COOKIE: posture_cockpit_v040_recette
      POSTURE_COCKPIT_DEFAULT_LOCALE: fr
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  recette-v040-data:
    name: posture-cockpit-v040-recette-data
