#
# Publishes the image ghcr.io/vinzgithub/posture-cockpit when a GitHub release is published
# (the explicit act of validation), after the whole test suite and the Docker recette.
# On a pull request that touches the image, the same steps run as a dry run against a registry
# started in the job (localhost:5000): nothing is logged in to, nothing reaches ghcr.io.
#
# Tags (scripts/release_tags.py): the exact version always; X.Y and latest for a final version
# only, and never backwards. A pre-release (v0.4.2-rc.1, "pre-release" box ticked) never moves
# X.Y nor latest.
#
# Publication in three steps, each checked (scripts/registry_tag.py):
# 1. the state of the exact version in the registry: absent (publish), built from this commit
#    (an interrupted publication resumes without rebuilding), built from another commit or from
#    an unknown one (refused: a published version is never overwritten). A registry that cannot
#    be read (authentication, network, error) stops everything: nothing is guessed;
# 2. both architectures pushed under the exact version only;
# 3. the moving tags (X.Y, latest) pointed at that digest, then every tag read back and compared.
# A failure between 2 and 3 leaves the exact version published and the moving tags where they
# were; re-running the job resumes at step 3.
name: release
on:
  release:
    types: [published]
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - docker/**
      - compose.yaml
      - pyproject.toml
      - src/**
      - scripts/**
      - .github/workflows/**

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    if: github.event_name == 'release'
    uses: ./.github/workflows/tests.yml

  image:
    needs: tests
    # On a pull request the tests run in tests.yml; for a release they must have passed here.
    if: ${{ !cancelled() && (needs.tests.result == 'success' || (github.event_name == 'pull_request' && needs.tests.result == 'skipped')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    services:
      registry:  # the target of the dry run; unused when a release is published
        image: registry:2
        ports:
          - 5000:5000
    env:
      PUBLISH: ${{ github.event_name == 'release' }}
      IMAGE: ${{ github.event_name == 'release' && format('ghcr.io/{0}', github.repository) || 'localhost:5000/posture-cockpit' }}
      TAG: ${{ github.event.release.tag_name }}
      PRERELEASE: ${{ github.event.release.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # the tags already released decide whether X.Y and latest move
      - name: Versions and tags
        id: release
        run: |
          if [ "$PUBLISH" = true ]; then
            python3 scripts/release_tags.py --image "$IMAGE" --tag "$TAG" --prerelease "$PRERELEASE" >> "$GITHUB_OUTPUT"
          else
            python3 scripts/release_tags.py --image "$IMAGE" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
        with:
          driver-opts: network=host  # reaches the registry of the dry run
          buildkitd-config-inline: |
            [registry."localhost:5000"]
              http = true

      - name: Build for amd64
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: posture-cockpit:candidate
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Recette of the amd64 image
        run: scripts/docker-recette.sh install posture-cockpit:candidate "${{ steps.release.outputs.version }}"
      - name: Build for arm64
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          load: true
          tags: posture-cockpit:candidate-arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start the arm64 image (emulated)
        run: scripts/docker-recette.sh quick posture-cockpit:candidate-arm64 "${{ steps.release.outputs.version }}"

      - name: Sign in to ghcr.io
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: State of the version in the registry
        id: registry
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ env.PUBLISH == 'true' && secrets.GITHUB_TOKEN || '' }}
        run: |
          python3 scripts/registry_tag.py state "$IMAGE:${{ steps.release.outputs.version }}" --revision "$GITHUB_SHA" \
            >> "$GITHUB_OUTPUT"
          if grep -q '^state=other$' "$GITHUB_OUTPUT"; then
            echo "::error::$IMAGE:${{ steps.release.outputs.version }} is already published from another commit: make a new version"
            exit 1
          fi
      - name: Push both architectures under the exact version
        id: build
        if: steps.registry.outputs.state == 'absent'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.release.outputs.version }}
          labels: |
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          annotations: |
            index:org.opencontainers.image.title=Posture Cockpit
            index:org.opencontainers.image.description=Passive security check of a domain, with a guided plan of fixes
            index:org.opencontainers.image.source=https://github.com/${{ github.repository }}
            index:org.opencontainers.image.licenses=PolyForm-Noncommercial-1.0.0
            index:org.opencontainers.image.version=${{ steps.release.outputs.version }}
            index:org.opencontainers.image.revision=${{ github.sha }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
      - name: Point the other tags at the same digest, then read every tag back
        id: tags
        env:
          DIGEST: ${{ steps.build.outputs.digest || steps.registry.outputs.digest }}
          TAGS: ${{ steps.release.outputs.tags }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ env.PUBLISH == 'true' && secrets.GITHUB_TOKEN || '' }}
        run: |
          [ -n "$DIGEST" ] || { echo "::error::no digest for the published version"; exit 1; }
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          for tag in ${TAGS//,/ }; do
            if [ "$tag" != "$IMAGE:${{ steps.release.outputs.version }}" ]; then
              docker buildx imagetools create --tag "$tag" "$IMAGE@$DIGEST"
            fi
          done
          for tag in ${TAGS//,/ }; do
            found=$(python3 scripts/registry_tag.py digest "$tag")
            [ "$found" = "$DIGEST" ] || { echo "::error::$tag points at $found instead of $DIGEST"; exit 1; }
            echo "$tag -> $found"
          done
      - name: "Dry run: the guards work on a real registry"
        if: env.PUBLISH != 'true'
        run: |
          version="$IMAGE:${{ steps.release.outputs.version }}"
          python3 scripts/registry_tag.py state "$version" --revision "$GITHUB_SHA" | grep -qx 'state=same'
          python3 scripts/registry_tag.py state "$version" --revision 0000000 | grep -qx 'state=other'
          python3 scripts/registry_tag.py state "$IMAGE:9.9.9" --revision "$GITHUB_SHA" | grep -qx 'state=absent'
          status=0; python3 scripts/registry_tag.py state localhost:5999/nothing:1 --revision x || status=$?
          [ "$status" = 2 ] || { echo "::error::an unreachable registry must stop the publication"; exit 1; }
          echo "::notice title=Publication guards::resume (same commit), refusal (other commit), absent tag and unreachable registry behave as expected on localhost:5000"
      - name: Summary
        run: |
          {
            echo "### ${{ env.PUBLISH == 'true' && 'Published' || 'Dry run on localhost:5000 (nothing reached ghcr.io)' }}: ${{ steps.release.outputs.version }}"
            echo
            echo "Tags: \`${{ steps.release.outputs.tags }}\`"
            echo
            echo "Digest: \`${{ steps.tags.outputs.digest }}\` (registry state before: ${{ steps.registry.outputs.state }})"
          } >> "$GITHUB_STEP_SUMMARY"
