#
# Posture Cockpit with Docker Compose (2.24 or later). Installation, in an empty folder:
#
#   curl -fsSLO https://raw.githubusercontent.com/vinzgithub/posture-cockpit/v0.6.0/compose.yaml
#   docker compose up -d
#
# then open http://<server>:8080/setup with the setup code of: docker compose logs posture-cockpit
#
# Do not edit this file: settings go in an optional .env file next to it (port, listening
# address, time zone, reverse proxy...: see .env.example). An update then only replaces this
# file with the one of the new version. Guide: docs/user/INSTALLATION.md.
name: posture-cockpit  # fixes the volume name, posture-cockpit_posture-cockpit-data, whatever the folder

services:
  posture-cockpit:
    image: ${POSTURE_COCKPIT_IMAGE:-ghcr.io/vinzgithub/posture-cockpit:0.6.1}
    container_name: ${POSTURE_COCKPIT_CONTAINER:-posture-cockpit}
    restart: unless-stopped
    ports:
      # [address:]port of the server -> 8080 in the container. Every interface unless POSTURE_COCKPIT_BIND is set.
      - "${POSTURE_COCKPIT_BIND:+${POSTURE_COCKPIT_BIND}:}${POSTURE_COCKPIT_PORT:-8080}:8080"
    env_file:
      - path: .env       # the POSTURE_COCKPIT_* settings of the application, if the file exists
        required: false
    environment:
      TZ: ${TZ:-Europe/Paris}
    volumes:
      - posture-cockpit-data:/data
    # The application runs as uid 10001, on a read-only system, without any privilege.
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  posture-cockpit-data:
